# ==============================================================================
# GENERAL LEDGER & AUDIT SERVICE CONFIGURATION (Append-Only)
# Profile: ledger
# ==============================================================================
server:
  port: 8084

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/ewallet_ledger_db
    username: ${DB_USER:ledger_app_user}
    password: ${DB_PASS:LedgerApp#Secure2025!}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LedgerAppendOnlyHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:wallet}
    password: ${RABBITMQ_PASS:wallet123}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledger-posting-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Envelope chung của KafkaEventEnvelope<T> từ Outbox Relay (Agent 1/2/3)
        spring.json.value.default.type: com.fintech.ledger.application.kafka.KafkaEventEnvelope
        spring.json.use.type.header: false
        spring.json.trusted.packages: "com.fintech.ledger,com.fintech.wallet,java.lang,java.util"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      ack-mode: manual_immediate      # Ack ngay sau khi commit DB — không mất event
      missing-topics-fatal: false
