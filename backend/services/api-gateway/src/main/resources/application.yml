# ==============================================================================
# API GATEWAY ROUTES - GIAI ĐOẠN 1: TÁCH NOTIFICATION SERVICE (Strangler Fig)
# File: gateway/gateway-routes.yml
# Mục tiêu: Định tuyến 6 prefix Notification sang notification-service:8085,
#           toàn bộ request còn lại fallback về Monolith monolith:8080.
# Rollback (< 30s): Đổi uri các route notification về http://monolith:8080
#                   (các controller này vẫn còn nguyên trong Monolith).
# ==============================================================================

spring:
  application:
    name: ewallet-api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        # Gỡ header giả mạo từ client trước khi xác thực/route (chống spoofing X-User-*)
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "http://localhost:3000"
              - "http://localhost:8080"
            allowedOriginPatterns:
              - "http://localhost:[*]"
              - "http://127.0.0.1:[*]"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
              - HEAD
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
              - X-Idempotency-Key
              - X-Trace-Id
              - X-User-Id
              - X-User-Roles
              - X-User-Role
              - X-Branch-Id
              - Cache-Control
              - "*"
            exposedHeaders:
              - Authorization
              - Content-Disposition
              - X-Total-Count
              - X-Trace-Id
              - X-User-Id
              - X-User-Roles
              - X-User-Role
              - X-Branch-Id
              - X-Idempotency-Key
            allowCredentials: true
            maxAge: 3600

      routes:
        # ----------------------------------------------------------------------------
        # GIAI ĐOẠN 1: 6 ROUTE CỦA NOTIFICATION SERVICE -> notification-service:8085
        # (Dịch vụ mới sở hữu ewallet_notification_db)
        # ----------------------------------------------------------------------------

        - id: notification-service-notifications
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthenticationFilter   # Tự kiểm tra blacklist: route này bắt buộc JWT
            - name: CircuitBreaker
              args:
                name: notificationServiceCb
                fallbackUri: forward:/fallback/notification

        - id: notification-service-devices
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/devices/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCb
                fallbackUri: forward:/fallback/notification

        - id: notification-service-support
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/support/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCb
                fallbackUri: forward:/fallback/notification

        - id: notification-service-feedback
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/feedback/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCb
                fallbackUri: forward:/fallback/notification

        - id: notification-service-promotions
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/promotions/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCb
                fallbackUri: forward:/fallback/notification

        - id: notification-service-referrals
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/referrals/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCb
                fallbackUri: forward:/fallback/notification

        - id: notification-service-websocket
          uri: ${NOTIFICATION_SERVICE_WS_URI:ws://notification-service:8085}
          predicates:
            - Path=/ws/**, /ws-native/**, /ws, /ws-native

        # ----------------------------------------------------------------------------
        # GIAI ĐOẠN 2: TÁCH GENERAL LEDGER & AUDIT SERVICE -> ledger-service:8084
        # ----------------------------------------------------------------------------
        - id: ledger-service-api
          uri: ${LEDGER_SERVICE_URI:http://ledger-service:8084}
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # GIAI ĐOẠN 3: TÁCH IDENTITY & AUTH SERVICE -> identity-service:8081
        # (Dịch vụ sở hữu ewallet_identity_db)
        # ----------------------------------------------------------------------------

        - id: identity-service-auth
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCb
                fallbackUri: forward:/fallback/identity

        - id: payment-service-user-qrcode
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/users/me/qrcode
          filters:
            - name: JwtAuthenticationFilter

        - id: identity-service-users
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCb
                fallbackUri: forward:/fallback/identity

        - id: identity-service-kyc
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/v1/kyc/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCb
                fallbackUri: forward:/fallback/identity

        - id: identity-service-sessions
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/v1/sessions/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCb
                fallbackUri: forward:/fallback/identity

        - id: identity-service-staff
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/v1/staff/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCb
                fallbackUri: forward:/fallback/identity

        - id: identity-service-security
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/v1/security/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCb
                fallbackUri: forward:/fallback/identity

        - id: identity-service-referrals
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/v1/referrals/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCb
                fallbackUri: forward:/fallback/identity

        - id: identity-service-legal
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/v1/legal/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCb
                fallbackUri: forward:/fallback/identity

        - id: identity-service-feedback
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/v1/feedback/**
          filters:
            - name: JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCb
                fallbackUri: forward:/fallback/identity

        # ----------------------------------------------------------------------------
        # WALLET MUTATIONS (Deposit & Withdraw) -> payment-service:8083 (SAGA)
        # ----------------------------------------------------------------------------
        - id: payment-service-wallet-mutations
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/wallets/deposit, /api/v1/wallets/withdraw
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # WALLET SERVICE: QUẢN LÝ VÍ & SỐ DƯ -> wallet-service:8082
        # ----------------------------------------------------------------------------
        - id: wallet-service-wallets
          uri: ${WALLET_SERVICE_URI:http://wallet-service:8082}
          predicates:
            - Path=/api/v1/wallets/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # CASH SERVICE: QUẦY GIAO DỊCH NẠP TIỀN (Maker-Checker & Cash Deposit) -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: cash-service-route
          uri: ${CASH_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/cash/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # PAYMENT SERVICE: GIAO DỊCH CHUYỂN TIỀN & P2P SAGA -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-route
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # TRANSACTION HISTORY: LỊCH SỬ BIẾN ĐỘNG SỐ DƯ -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-transactions
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # SAVINGS SERVICE: SỔ TIẾT KIỆM ONLINE CORE BANKING -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-savings
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/savings/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # LOANS SERVICE: VAY TIÊU DÙNG NHANH CORE BANKING -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-loans
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/loans/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # CARDS CMS: QUẢN LÝ THẺ VẬT LÝ & THẺ ẢO -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-cards
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/cards/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # BANK ACCOUNTS: LIÊN KẾT TÀI KHOẢN NGÂN HÀNG -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-bank-accounts
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/bank-accounts/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # FUNDING SOURCES: NGUỒN TIỀN THANH TOÁN -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-funding-sources
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/funding-sources/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # BILLS SERVICE: THANH TOÁN HÓA ĐƠN & NẠP ĐIỆN THOẠI -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-bills
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/bills/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # BENEFICIARIES: DANH BẠ NGƯỜI THỤ HƯỞNG -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-beneficiaries
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/beneficiaries/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # CONFIG LIMITS: HẠN MỨC GIAO DỊCH CORE BANKING -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-config-limits
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/config/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # LOTTERY: XỔ SỐ ĐIỆN TOÁN SENBANK -> payment-service:8083
        # ----------------------------------------------------------------------------
        - id: payment-service-lottery
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8083}
          predicates:
            - Path=/api/v1/lottery/**
          filters:
            - name: JwtAuthenticationFilter

        # ----------------------------------------------------------------------------
        # FALLBACK: TOÀN BỘ CÁC API CÒN LẠI -> MONOLITH CŨ (monolith:8080)
        # (Wallet Core, Payment, Transaction, Ledger query, QR, ...)
        # ----------------------------------------------------------------------------

        - id: monolith-fallback
          uri: ${MONOLITH_URI:http://monolith:8080}
          predicates:
            - Path=/api/v1/**
          filters:
            - name: JwtAuthenticationFilter
            - StripPrefix=0

# ------------------------------------------------------------------------------
# CIRCUIT BREAKER (Resilience4j): Nếu microservice downstream sập, chuyển về fallback
# ------------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      notificationServiceCb:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
      identityServiceCb:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
