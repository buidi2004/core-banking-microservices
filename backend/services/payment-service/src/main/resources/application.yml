# ==============================================================================
# PAYMENT & TRANSACTION SAGA SERVICE CONFIGURATION
# Profile: payment
# ==============================================================================
server:
  port: 8083

grpc:
  client:
    wallet-service:
      address: static://${WALLET_GRPC_HOST:localhost}:${WALLET_GRPC_PORT:9090}
      negotiation-type: plaintext
      # Keep-alive & timeout cho chiamata đồng bộ Wallet Service
      keepalive-time: 30s
      keepalive-timeout: 10s
      enable-keepalive: true

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/ewallet_payment_db
    username: ${DB_USER:payment_db_user}
    password: ${DB_PASS:PaymentDb#Secure2025!}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaymentHikariPool
      maximum-pool-size: 30
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:wallet}
    password: ${RABBITMQ_PASS:wallet123}
    listener:
      simple:
        acknowledge-mode: manual

# ==============================================================================
# KAFKA PRODUCER (AGENT 3) - Stream Saga Transaction Lifecycle
# Dual-Broker: RabbitMQ (task queue) + Kafka (event stream)
# ==============================================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      enable-idempotence: true
      retries: 2147483647
      max-in-flight-requests-per-connection: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "*"
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    topic:
      payment-transaction-lifecycle: banking.payment.transaction-lifecycle.v1
  task:
    scheduling:
      pool-size: 2

# RabbitMQ Topology (tương đồng doc architecture 5.md)
rabbitmq:
  exchange:
    # Phải trùng tên exchange mà notification-service và ledger-service đang bind
    # (wallet.transaction.events / transaction.#). Trước đây để wallet.exchange
    # nên event rơi vào exchange không có consumer -> mất thông báo.
    name: wallet.transaction.events
  routing:
    key:
      transaction: transaction.completed
      reversed: transaction.reversed
      failed: transaction.failed

# Saga / Outbox
saga:
  p2p:
    timeout-seconds: 30
  outbox:
    # 500ms để thông báo realtime tới mobile nhanh (trước đây 2s).
    poll-interval-ms: 500
    batch-size: 50
    max-retry: 5

management:
  endpoints:
    web:
      exposure:
        health: true
        info: true
