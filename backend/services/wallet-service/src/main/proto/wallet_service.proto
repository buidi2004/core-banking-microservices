syntax = "proto3";

package com.fintech.wallet.grpc;

option java_multiple_files = true;
option java_package = "com.fintech.wallet.grpc";
option java_outer_classname = "WalletServiceProto";

// ============================================================================
// WALLET INTERNAL SERVICE - Hợp đồng gRPC liên dịch vụ
// Payment Service gọi Wallet Service qua giao thức nhị phân, độ trễ < 2ms
// ============================================================================

service WalletInternalService {
  // Trừ tiền từ ví
  rpc DebitWallet (DebitRequest) returns (DebitResponse);

  // Cộng tiền vào ví
  rpc CreditWallet (CreditRequest) returns (CreditResponse);

  // Khóa một khoản tiền tạm thời (Reserve)
  rpc ReserveBalance (ReserveRequest) returns (ReserveResponse);

  // Giải phóng khoản tiền đã khóa (Release)
  rpc ReleaseBalance (ReleaseRequest) returns (ReleaseResponse);

  // Kiểm tra hạn mức giao dịch
  rpc CheckLimit (LimitCheckRequest) returns (LimitCheckResponse);

  // Tra cứu ví theo user_id
  rpc GetWalletByUserId (UserWalletRequest) returns (WalletResponse);
}

// --------------------------- REQUEST / RESPONSE MESSAGES ----------------------

message DebitRequest {
  string wallet_id = 1;
  int64 amount = 2;                        // Đơn vị tiểu đơn vị (vND)
  string transaction_id = 3;               // ID giao dịch từ Payment Service
  string idempotency_key = 4;              // Khóa bất biến chống trùng lặp
}

message DebitResponse {
  bool success = 1;
  int64 balance_after = 2;
  string error_code = 3;
  string error_message = 4;
}

message CreditRequest {
  string wallet_id = 1;
  int64 amount = 2;                        // Đơn vị tiểu đơn vị (vND)
  string transaction_id = 3;
  string idempotency_key = 4;
}

message CreditResponse {
  bool success = 1;
  int64 balance_after = 2;
  string error_code = 3;
  string error_message = 4;
}

message ReserveRequest {
  string wallet_id = 1;
  int64 amount = 2;
  string transaction_id = 3;
  int32 reserve_duration_seconds = 4;      // Thời gian khóa (mặc định: 3600s)
}

message ReserveResponse {
  bool success = 1;
  int64 reserved_amount = 2;
  string reservation_id = 3;
  string error_code = 4;
  string error_message = 5;
}

message ReleaseRequest {
  string reservation_id = 1;
  string transaction_id = 2;
}

message ReleaseResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
}

message LimitCheckRequest {
  string wallet_id = 1;
  int64 amount = 2;
  string transaction_type = 3;             // 'TRANSFER' | 'TOPUP' | 'WITHDRAWAL'
  string user_id = 4;
}

message LimitCheckResponse {
  bool allowed = 1;
  int64 available_balance = 2;
  int64 daily_limit_remaining = 3;
  int64 transaction_limit_remaining = 4;
  string error_code = 5;
  string error_message = 6;
}

message UserWalletRequest {
  string user_id = 1;
}

message WalletResponse {
  bool found = 1;
  string wallet_id = 2;
  string user_id = 3;
  int64 balance = 4;
  string currency = 5;
  string status = 6;                       // 'ACTIVE' | 'FROZEN' | 'CLOSED'
  string error_code = 7;
  string error_message = 8;
}

// --------------------------- ERROR CODES -------------------------------------
// DEBIT_INSUFFICIENT_BALANCE : Không đủ số dư
// DEBIT_WALLET_FROZEN        : Ví bị đóng băng
// DEBIT_IDEMPOTENT           : Giao dịch đã tồn tại
// RESERVE_INSUFFICIENT       : Không đủ số dư khả dụng (balance - reserved)
// RELEASE_NOT_FOUND          : Không tìm thấy reservation
// LIMIT_EXCEEDED             : Vượt hạn mức
// WALLET_NOT_FOUND           : Không tìm thấy ví
