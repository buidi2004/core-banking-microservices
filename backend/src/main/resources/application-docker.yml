server:
  port: 8080

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://postgres:5432/walletdb
    driverClassName: org.postgresql.Driver
    username: walletuser
    password: walletpassword

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
