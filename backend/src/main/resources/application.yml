resilience4j:
  retry:
    instances:
      bankGateway:
        maxAttempts: 3
        retryExceptions:
        - java.net.SocketTimeoutException
        - java.util.concurrent.TimeoutException
        - java.lang.RuntimeException
        waitDuration: 50ms
server:
  port: 8080
spring:
  application:
    name: wallet-service
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  datasource:
    driverClassName: org.postgresql.Driver
    password: walletpassword
    username: walletuser
    url: jdbc:postgresql://localhost:5432/walletdb

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:wallet}
    password: ${RABBITMQ_PASS:wallet123}
    publisher-confirm-type: correlated
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2.0
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
