# ==============================================================================
# HỆ THỐNG MICROSERVICES VÍ ĐIỆN TỬ (DATABASE-PER-SERVICE)
# Bao gồm:
#   1. 5 Postgres instances/databases độc lập (Identity, Wallet, Payment, Ledger, Notification)
#   2. Cụm Redis tập trung (Distributed Lock, Blacklist JWT, Idempotency)
#   3. Message Broker RabbitMQ (Exchange topic, Dead Letter Exchange)
#   4. API Gateway (Spring Cloud Gateway / Route Dispatcher / JWT Filter)
#   5. 5 Microservices riêng biệt (Identity, Wallet, Payment, Ledger, Notification)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE 1: IDENTITY & AUTH SERVICE DB
  # ----------------------------------------------------------------------------
  postgres-identity:
    image: postgres:15-alpine
    container_name: ewallet-postgres-identity
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ewallet_identity_db
      POSTGRES_USER: identity_db_user
      POSTGRES_PASSWORD: IdentityDb#Secure2025!
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
      - ./services/identity-service/src/main/resources/db/migration/V1__init_identity_db.sql:/docker-entrypoint-initdb.d/01-init-identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_db_user -d ewallet_identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 2. DATABASE 2: WALLET CORE SERVICE DB (High-speed balance locks)
  # ----------------------------------------------------------------------------
  postgres-wallet:
    image: postgres:15-alpine
    container_name: ewallet-postgres-wallet
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ewallet_wallet_db
      POSTGRES_USER: wallet_db_user
      POSTGRES_PASSWORD: WalletDb#Secure2025!
    volumes:
      - postgres-wallet-data:/var/lib/postgresql/data
      - ./services/wallet-service/src/main/resources/db/migration/V1__init_wallet_db.sql:/docker-entrypoint-initdb.d/01-init-wallet.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_db_user -d ewallet_wallet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 3. DATABASE 3: PAYMENT & TRANSACTION SAGA DB
  # ----------------------------------------------------------------------------
  postgres-payment:
    image: postgres:15-alpine
    container_name: ewallet-postgres-payment
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ewallet_payment_db
      POSTGRES_USER: payment_db_user
      POSTGRES_PASSWORD: PaymentDb#Secure2025!
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
      - ./services/payment-service/src/main/resources/db/migration/V1__init_payment_db.sql:/docker-entrypoint-initdb.d/01-init-payment.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_db_user -d ewallet_payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 4. DATABASE 4: GENERAL LEDGER & AUDIT DB (Append-Only)
  # ----------------------------------------------------------------------------
  postgres-ledger:
    image: postgres:15-alpine
    container_name: ewallet-postgres-ledger
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: ewallet_ledger_db
      POSTGRES_USER: ledger_app_user
      POSTGRES_PASSWORD: LedgerApp#Secure2025!
    volumes:
      - postgres-ledger-data:/var/lib/postgresql/data
      - ./services/ledger-service/src/main/resources/db/migration/V1__init_ledger_db.sql:/docker-entrypoint-initdb.d/01-init-ledger.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_app_user -d ewallet_ledger_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 5. DATABASE 5: NOTIFICATION & ENGAGEMENT SERVICE DB
  # ----------------------------------------------------------------------------
  postgres-notification:
    image: postgres:15-alpine
    container_name: ewallet-postgres-notification
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: ewallet_notification_db
      POSTGRES_USER: notification_db_user
      POSTGRES_PASSWORD: NotificationDb#Secure2025!
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
      - ./services/notification-service/src/main/resources/db/migration/V1__init_notification_db.sql:/docker-entrypoint-initdb.d/01-init-notification.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_db_user -d ewallet_notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # REDIS DISTRIBUTED CACHE & LOCK
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ewallet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-microservices-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # RABBITMQ MESSAGE BROKER (Topic Exchanges, Dead Letter, DLQ)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ewallet-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: wallet
      RABBITMQ_DEFAULT_PASS: wallet123
    volumes:
      - rabbitmq-microservices-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # APACHE KAFKA (KRaft Mode - Event Stream)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ewallet-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # KAFKA-UI (Web Dashboard - Monitoring Topics & Consumer Lag)
  # ----------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ewallet-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ewallet-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # API GATEWAY (Spring Cloud Gateway)
  # ----------------------------------------------------------------------------
  api-gateway:
    build: ./services/api-gateway
    container_name: ewallet-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 5 MICROSERVICES CONTAINERS
  # ----------------------------------------------------------------------------
  identity-service:
    build: ./services/identity-service
    container_name: ewallet-identity-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres-identity
      DB_PORT: 5432
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres-identity:
        condition: service_healthy
    networks:
      - microservices-network

  wallet-service:
    build: ./services/wallet-service
    container_name: ewallet-wallet-service
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "9090:9090"
    environment:
      DB_HOST: postgres-wallet
      DB_PORT: 5432
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-wallet:
        condition: service_healthy
    networks:
      - microservices-network

  payment-service:
    build: ./services/payment-service
    container_name: ewallet-payment-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres-payment
      DB_PORT: 5432
      WALLET_GRPC_HOST: wallet-service
      WALLET_GRPC_PORT: 9090
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-payment:
        condition: service_healthy
    networks:
      - microservices-network

  ledger-service:
    build: ./services/ledger-service
    container_name: ewallet-ledger-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres-ledger
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-ledger:
        condition: service_healthy
    networks:
      - microservices-network

  notification-service:
    build: ./services/notification-service
    container_name: ewallet-notification-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres-notification
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-notification:
        condition: service_healthy
    networks:
      - microservices-network

volumes:
  postgres-identity-data:
  postgres-wallet-data:
  postgres-payment-data:
  postgres-ledger-data:
  postgres-notification-data:
  redis-microservices-data:
  rabbitmq-microservices-data:
  kafka-data:

networks:
  microservices-network:
    name: ewallet-microservices-net
    driver: bridge
