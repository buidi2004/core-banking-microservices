# ==============================================================================
# HỆ THỐNG MICROSERVICES VÍ ĐIỆN TỬ (DATABASE-PER-SERVICE)
# Bao gồm:
#   1. 5 Postgres instances/databases độc lập (Identity, Wallet, Payment, Ledger, Notification)
#   2. Cụm Redis tập trung (Distributed Lock, Blacklist JWT, Idempotency)
#   3. Message Broker RabbitMQ (Exchange topic, Dead Letter Exchange)
#   4. API Gateway (Spring Cloud Gateway / Route Dispatcher / JWT Filter)
#   5. 5 Microservices riêng biệt (Identity, Wallet, Payment, Ledger, Notification)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE 1: IDENTITY & AUTH SERVICE DB
  # ----------------------------------------------------------------------------
  postgres-identity:
    image: postgres:15-alpine
    container_name: ewallet-postgres-identity
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=4MB", "-c", "max_connections=150"]
    mem_limit: 150m
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ewallet_identity_db
      POSTGRES_USER: identity_db_user
      POSTGRES_PASSWORD: IdentityDb#Secure2025!
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
      - ./backend/services/identity-service/src/main/resources/db/migration/V1__init_identity_db.sql:/docker-entrypoint-initdb.d/01-init-identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_db_user -d ewallet_identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 2. DATABASE 2: WALLET CORE SERVICE DB (High-speed balance locks)
  # ----------------------------------------------------------------------------
  postgres-wallet:
    image: postgres:15-alpine
    container_name: ewallet-postgres-wallet
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=4MB", "-c", "max_connections=150"]
    mem_limit: 150m
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ewallet_wallet_db
      POSTGRES_USER: wallet_db_user
      POSTGRES_PASSWORD: WalletDb#Secure2025!
    volumes:
      - postgres-wallet-data:/var/lib/postgresql/data
      - ./backend/services/wallet-service/src/main/resources/db/migration/V1__init_wallet_db.sql:/docker-entrypoint-initdb.d/01-init-wallet.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_db_user -d ewallet_wallet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 3. DATABASE 3: PAYMENT & TRANSACTION SAGA DB
  # ----------------------------------------------------------------------------
  postgres-payment:
    image: postgres:15-alpine
    container_name: ewallet-postgres-payment
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=4MB", "-c", "max_connections=150"]
    mem_limit: 150m
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ewallet_payment_db
      POSTGRES_USER: payment_db_user
      POSTGRES_PASSWORD: PaymentDb#Secure2025!
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
      - ./backend/services/payment-service/src/main/resources/db/migration/V1__init_payment_db.sql:/docker-entrypoint-initdb.d/01-init-payment.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_db_user -d ewallet_payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 4. DATABASE 4: GENERAL LEDGER & AUDIT DB (Append-Only)
  # ----------------------------------------------------------------------------
  postgres-ledger:
    image: postgres:15-alpine
    container_name: ewallet-postgres-ledger
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=4MB", "-c", "max_connections=150"]
    mem_limit: 150m
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: ewallet_ledger_db
      POSTGRES_USER: ledger_app_user
      POSTGRES_PASSWORD: LedgerApp#Secure2025!
    volumes:
      - postgres-ledger-data:/var/lib/postgresql/data
      - ./backend/services/ledger-service/src/main/resources/db/migration/V1__init_ledger_db.sql:/docker-entrypoint-initdb.d/01-init-ledger.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_app_user -d ewallet_ledger_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 5. DATABASE 5: NOTIFICATION & ENGAGEMENT SERVICE DB
  # ----------------------------------------------------------------------------
  postgres-notification:
    image: postgres:15-alpine
    container_name: ewallet-postgres-notification
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=4MB", "-c", "max_connections=150"]
    mem_limit: 150m
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: ewallet_notification_db
      POSTGRES_USER: notification_db_user
      POSTGRES_PASSWORD: NotificationDb#Secure2025!
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
      - ./backend/services/notification-service/src/main/resources/db/migration/V1__init_notification_db.sql:/docker-entrypoint-initdb.d/01-init-notification.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_db_user -d ewallet_notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 6. DATABASE 6: AI CHATBOT & KNOWLEDGE VECTOR DB (pgvector)
  # ----------------------------------------------------------------------------
  postgres-chatbot:
    image: pgvector/pgvector:pg16
    container_name: ewallet-postgres-chatbot
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=8MB", "-c", "max_connections=100"]
    mem_limit: 200m
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: ewallet_chatbot_db
      POSTGRES_USER: chatbot_db_user
      POSTGRES_PASSWORD: ChatbotDb#Secure2025!
    volumes:
      - postgres-chatbot-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_db_user -d ewallet_chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # REDIS DISTRIBUTED CACHE & LOCK
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ewallet-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 64m
    ports:
      - "6379:6379"
      - "6381:6379"
    volumes:
      - redis-microservices-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # RABBITMQ MESSAGE BROKER (Topic Exchanges, Dead Letter, DLQ)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ewallet-rabbitmq
    restart: unless-stopped
    mem_limit: 200m
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: wallet
      RABBITMQ_DEFAULT_PASS: wallet123
    volumes:
      - rabbitmq-microservices-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # APACHE KAFKA (KRaft Mode - Event Stream)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ewallet-kafka
    restart: unless-stopped
    mem_limit: 640m
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms192m -Xmx320m -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # KAFKA-UI (Optional Monitoring - Profiling enabled on demand)
  # ----------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ewallet-kafka-ui
    profiles: ["monitoring"]
    restart: unless-stopped
    mem_limit: 220m
    ports:
      - "8090:8080"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx160m -XX:+UseSerialGC"
      KAFKA_CLUSTERS_0_NAME: ewallet-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # API GATEWAY (Spring Cloud Gateway)
  # ----------------------------------------------------------------------------
  api-gateway:
    build: ./backend/services/api-gateway
    container_name: ewallet-api-gateway
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -Xms128m -Xmx320m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=128m -Xss256k"
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/services/api-gateway/src/main/resources/application.yml:/app/application.yml:ro
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 5 MICROSERVICES CONTAINERS
  # ----------------------------------------------------------------------------
  identity-service:
    build: ./backend/services/identity-service
    container_name: ewallet-identity-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -Xms128m -Xmx320m -XX:MaxMetaspaceSize=192m -Xss256k"
      DB_HOST: postgres-identity
      DB_PORT: 5432
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Gmail SMTP cho tính năng gửi OTP qua Email
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-buidi7170@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-hoykscffvyeesbox}
    depends_on:
      postgres-identity:
        condition: service_healthy
    networks:
      - microservices-network

  wallet-service:
    build: ./backend/services/wallet-service
    container_name: ewallet-wallet-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8082:8082"
      - "9090:9090"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -Xms128m -Xmx320m -XX:MaxMetaspaceSize=192m -Xss256k"
      DB_HOST: postgres-wallet
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # wallet-service gọi identity-service nội bộ để map phone -> userId
      IDENTITY_SERVICE_URL: http://identity-service:8081
    depends_on:
      postgres-wallet:
        condition: service_healthy
    networks:
      - microservices-network

  payment-service:
    build: ./backend/services/payment-service
    container_name: ewallet-payment-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -Xms128m -Xmx320m -XX:MaxMetaspaceSize=192m -Xss256k"
      DB_HOST: postgres-payment
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      WALLET_GRPC_HOST: wallet-service
      WALLET_GRPC_PORT: 9090
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-payment:
        condition: service_healthy
    networks:
      - microservices-network

  ledger-service:
    build: ./backend/services/ledger-service
    container_name: ewallet-ledger-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -Xms128m -Xmx320m -XX:MaxMetaspaceSize=192m -Xss256k"
      DB_HOST: postgres-ledger
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-ledger:
        condition: service_healthy
    networks:
      - microservices-network

  notification-service:
    build: ./backend/services/notification-service
    container_name: ewallet-notification-service
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -Xms128m -Xmx320m -XX:MaxMetaspaceSize=192m -Xss256k"
      DB_HOST: postgres-notification
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Tra cứu số điện thoại chủ ví để hiển thị trong nội dung thông báo
      IDENTITY_SERVICE_URL: http://identity-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8082
    depends_on:
      postgres-notification:
        condition: service_healthy
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # 6. AI CHATBOT SERVICE (Python FastAPI + PostgreSQL pgvector + multilingual-e5 RAG)
  # ----------------------------------------------------------------------------
  chatbot-service:
    build: ./backend/services/chatbot-service
    container_name: ewallet-chatbot-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    mem_limit: 1024m
    env_file:
      - ./backend/services/chatbot-service/.env
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chatbot_db_user:ChatbotDb#Secure2025!@postgres-chatbot:5432/ewallet_chatbot_db
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BACKUP_API_KEY: ${LLM_BACKUP_API_KEY:-}
      LLM_TERTIARY_API_KEY: ${LLM_TERTIARY_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      EMBED_MODEL: intfloat/multilingual-e5-small
      DATA_DIR: /app/data
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-senhong-internal-chatbot-key-2026}
    volumes:
      - ./backend/services/chatbot-service/app:/app/app
      - ./backend/services/chatbot-service/data:/app/data
      - chatbot-cache:/root/.cache
    depends_on:
      postgres-chatbot:
        condition: service_healthy
    networks:
      - microservices-network

  # ----------------------------------------------------------------------------
  # eKYC AI SERVICE — Anti-spoofing & Face Matching (ONNX Runtime GPU, GTX 1650)
  # Yêu cầu host đã cài nvidia-container-toolkit
  # ----------------------------------------------------------------------------
  ekyc-ai-service:
    build: ./backend/services/ekyc-ai-service
    container_name: ewallet-ekyc-ai-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8900", "--workers", "1"]
    mem_limit: 2g
    environment:
      EKYC_REDIS_URL: redis://redis:6379/2
      EKYC_SESSION_TTL: "240"
      EKYC_FACE_MATCH_THRESHOLD: "0.68"
      EKYC_ONNX_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
      IDENTITY_SERVICE_URL: http://identity-service:8081
      INTERNAL_API_KEY: senhong-internal-ekyc-key-2026
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./backend/services/ekyc-ai-service/certs:/app/certs:ro
    ports:
      - "8900:8900"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/api/v1/ekyc/ai/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - microservices-network

volumes:
  chatbot-cache:
  postgres-identity-data:
  postgres-wallet-data:
  postgres-payment-data:
  postgres-ledger-data:
  postgres-notification-data:
  postgres-chatbot-data:
  redis-microservices-data:
  rabbitmq-microservices-data:
  kafka-data:

networks:
  microservices-network:
    name: ewallet-microservices-net
    driver: bridge
