name: ekyc_sdk
description: "Sen Hồng Core Banking eKYC SDK - Liveness Detection, NFC CCCD chip reader, Biometric Encryption"
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  google_mlkit_text_recognition: ^0.14.0
  nfc_manager: ^3.3.0
  pointycastle: ^3.9.1
  crypto: ^3.0.3
  http: ^1.2.0
  intl: ^0.20.2
  flutter_cccd_vn: ^2.0.2
  flutter_nfc_kit: ^3.7.0
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

