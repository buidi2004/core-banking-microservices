# ==============================================================================
# PAYMENT & TRANSACTION SAGA SERVICE CONFIGURATION
# Profile: payment
# ==============================================================================
server:
  port: 8083

grpc:
  client:
    wallet-service:
      address: static://${WALLET_GRPC_HOST:localhost}:${WALLET_GRPC_PORT:9090}
      negotiation-type: plaintext
      # Keep-alive & timeout cho chiamata đồng bộ Wallet Service
      keepalive-time: 30s
      keepalive-timeout: 10s
      enable-keepalive: true

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/ewallet_payment_db
    username: ${DB_USER:payment_db_user}
    password: ${DB_PASS:PaymentDb#Secure2025!}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaymentHikariPool
      maximum-pool-size: 30
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/payment
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:wallet}
    password: ${RABBITMQ_PASS:wallet123}
    listener:
      simple:
        acknowledge-mode: manual
  task:
    scheduling:
      pool-size: 2

# RabbitMQ Topology (tương đồng doc architecture 5.md)
rabbitmq:
  exchange:
    name: wallet.exchange
  queue:
    payment: payment.outbox.queue
  routing:
    key:
      transaction: transaction.completed
      reversed: transaction.reversed
      failed: transaction.failed

# Saga / Outbox
saga:
  p2p:
    timeout-seconds: 30
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
    max-retry: 5

# Redis (idempotency & distributed lock cho saga)
data:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        health: true
        info: true
