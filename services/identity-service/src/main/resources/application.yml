# ==============================================================================
# IDENTITY & AUTH SERVICE CONFIGURATION
# Microservice: services/identity-service
# Port: 8081
# ==============================================================================
server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/ewallet_identity_db
    username: ${DB_USER:identity_db_user}
    password: ${DB_PASS:IdentityDb#Secure2025!}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: IdentityHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/identity
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:wallet}
    password: ${RABBITMQ_PASSWORD:wallet123}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2.0

wallet:
  jwt:
    secret: ${JWT_SECRET:SuperSecretKeyForFintechWalletAppShouldBeAtLeast32BytesLong!}
    access-token-expiration-seconds: 3600       # 1 giờ
    refresh-token-expiration-seconds: 604800   # 7 ngày
  rabbitmq:
    exchange: wallet.exchange
    routing-key:
      user-registered: wallet.user.registered
  redis:
    namespace:
      otp: "identity:otp:"
      session: "identity:session:"
      blacklist: "identity:blacklist:"
      attempts: "identity:attempts:"
      locked: "identity:locked:"
