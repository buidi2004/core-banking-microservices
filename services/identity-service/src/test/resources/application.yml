spring:
  application:
    name: identity-service-test
  datasource:
    url: jdbc:h2:mem:identitytestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672

wallet:
  jwt:
    secret: SuperSecretKeyForFintechWalletAppShouldBeAtLeast32BytesLong!
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 604800
  rabbitmq:
    exchange: wallet.exchange
    routing-key:
      user-registered: wallet.user.registered
