resilience4j:
  retry:
    instances:
      bankGateway:
        maxAttempts: 3
        retryExceptions:
        - java.net.SocketTimeoutException
        - java.util.concurrent.TimeoutException
        - java.lang.RuntimeException
        waitDuration: 50ms
server:
  port: 8080
spring:
  application:
    name: wallet-service
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  datasource:
    driverClassName: org.h2.Driver
    password: null
    url: jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
