name: sen_hong_bank
description: "Dự án Ví Điện Tử Sen Hồng (Fintech E-Wallet) chuyển đổi sang Flutter với kiến trúc Clean Architecture và Liquid Glass Widgets"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Liquid Glass
  liquid_glass_widgets: ^1.3.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Navigation & Routing
  go_router: ^14.8.1

  # Networking & Realtime
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  stomp_dart_client: ^2.1.3

  # Security & Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  local_auth: ^2.3.0

  # QR Code & Scanning
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  permission_handler: ^11.3.1
  image_picker: ^1.2.3
  morphnext: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/senbank_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/senbank_app_icon.png"
