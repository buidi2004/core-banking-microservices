# ==============================================================================
# GENERAL LEDGER & AUDIT SERVICE CONFIGURATION (Append-Only)
# Profile: ledger
# ==============================================================================
server:
  port: 8084

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/ewallet_ledger_db
    username: ${DB_USER:ledger_app_user}
    password: ${DB_PASS:LedgerApp#Secure2025!}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LedgerAppendOnlyHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/ledger
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
