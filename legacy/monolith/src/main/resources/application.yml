resilience4j:
  retry:
    instances:
      bankGateway:
        maxAttempts: 3
        retryExceptions:
        - java.net.SocketTimeoutException
        - java.util.concurrent.TimeoutException
        - java.lang.RuntimeException
        waitDuration: 50ms
server:
  port: 8080
spring:
  application:
    name: wallet-service
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  datasource:
    driverClassName: org.postgresql.Driver
    password: walletpassword
    username: walletuser
    url: jdbc:postgresql://localhost:5432/walletdb
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: WalletHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:wallet}
    password: ${RABBITMQ_PASS:wallet123}
    publisher-confirm-type: correlated
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2.0
    listener:
      simple:
        prefetch: 10
        concurrency: 3
        max-concurrency: 10
        acknowledge-mode: auto
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

firebase:
  credential:
    path: ${FIREBASE_CREDENTIAL_PATH:classpath:firebase-service-account.json}
