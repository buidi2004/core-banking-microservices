# ==============================================================================
# WALLET CORE SERVICE CONFIGURATION (High I/O Locking & Balance Engine)
# Profile: wallet
# ==============================================================================
server:
  port: 8082

grpc:
  server:
    port: 9090

spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/ewallet_wallet_db
    username: ${DB_USER:wallet_db_user}
    password: ${DB_PASS:WalletDb#Secure2025!}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: WalletCoreHikariPool
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/wallet
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
