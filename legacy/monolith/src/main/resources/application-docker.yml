server:
  port: 8080

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://postgres:5432/walletdb
    driverClassName: org.postgresql.Driver
    username: walletuser
    password: walletpassword
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: WalletHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:wallet}
    password: ${RABBITMQ_PASS:wallet123}
    publisher-confirm-type: correlated
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2.0
    listener:
      simple:
        prefetch: 10
        concurrency: 3
        max-concurrency: 10
        acknowledge-mode: auto

firebase:
  credential:
    path: ${FIREBASE_CREDENTIAL_PATH:classpath:firebase-service-account.json}
