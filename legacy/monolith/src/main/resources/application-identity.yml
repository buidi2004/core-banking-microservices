# ==============================================================================
# IDENTITY & AUTH SERVICE CONFIGURATION
# Profile: identity
# ==============================================================================
server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/ewallet_identity_db
    username: ${DB_USER:identity_db_user}
    password: ${DB_PASS:IdentityDb#Secure2025!}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: IdentityHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration/identity
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
